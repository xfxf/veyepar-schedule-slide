<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>PyCon AU 2026 Schedule</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600&family=Roboto+Slab&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="common.css?_=20260816-00" />
        <link rel="stylesheet" href="loop.css?_=20260816-00" />
    </head>

    <body
        data-show="pyconau_2026"
        data-client="pyconau"
        data-next-event-title="Starting at {time}"
        data-up-next-title="Up next"
        data-presenter-list="1"
    >
        <div id="timewarp-indicator"></div>
        <div id="clock-box" class="jakarta">
            <span id="now"></span>
        </div>

        <div id="left">
            <div>
                <p id="up-next" class="roboto starting-at"></p>
            </div>
            <div class="jakarta body-text">
                <ul id="presenter"></ul>
            </div>
        </div>

        <div id="right">
            <div>
                <p id="starting-at" class="roboto starting-at"></p>
            </div>

            <div class="jakarta body-text">
                <p id="title"></p>
            </div>
        </div>

        <script src="../schedule.js?_=20260815-00"></script>
    </body>
</html>
